<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">E-Vision product ecosystem</title><desc id="desc">Cameras and NVRs connect through supported interfaces to E-VMS. ANPR event exchange with E-VMS is locally verified. CAAMOO is a separate investigation application; a direct E-VMS connection is proposed.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627b8d"/></marker></defs><rect width="720" height="700" rx="8" fill="#101820"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="35" y="47" font-size="24" font-weight="bold">FROM SOURCE TO OPERATOR</text><rect x="35" y="77" width="650" height="85" rx="8" fill="#233443"/><text x="60" y="112" font-size="27" font-weight="bold">Cameras + NVRs</text><text x="60" y="143" font-size="21" fill="#ccd8e0">Supported device interfaces · device-specific acceptance</text><path d="M360 162V219" stroke="#627b8d" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="230" width="650" height="90" rx="8" fill="#932334"/><text x="60" y="265" font-size="29" font-weight="bold">E-VMS</text><text x="60" y="298" font-size="22">Monitor · record · find footage · review</text><rect x="35" y="405" width="310" height="113" rx="8" fill="#19443e"/><text x="57" y="445" font-size="28" font-weight="bold">ANPR</text><text x="57" y="477" font-size="21">Recognition events</text><text x="57" y="503" font-size="19" fill="#c7e7df">Event bridge: locally verified</text><path d="M190 405V335" stroke="#54c8b3" stroke-width="3" marker-end="url(#a)"/><text x="207" y="367" font-size="18" fill="#a8e0d5">event exchange</text><rect x="375" y="405" width="310" height="113" rx="8" fill="#343044"/><text x="397" y="445" font-size="28" font-weight="bold">CAAMOO</text><text x="397" y="477" font-size="21">Evidence + questions</text><text x="397" y="503" font-size="19" fill="#d8d1ed">Standalone application</text><path d="M530 405V335" stroke="#b6a1cc" stroke-width="3" stroke-dasharray="7 7"/><text x="399" y="367" font-size="18" fill="#d8d1ed">proposed connection</text><rect x="35" y="555" width="650" height="100" rx="8" fill="#233443"/><text x="60" y="593" font-size="27" font-weight="bold">Authorized operator workflows</text><text x="60" y="625" font-size="21">Separate product grants · scoped access · retained evidence</text></g></svg>